name: Generate Sitemap

on:
  push:
    branches: [ main ]          # run when you update the site
  schedule:
    - cron: '0 0 * * 0'         # weekly, 00:00 UTC Sunday
  workflow_dispatch:            # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to push sitemap.xml
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1    # MIT‑licensed Action0
        with:
          path-to-root: "."                    # root of your site
          base-url: "https://andressaraviamoya.github.io"

      - name: Commit and push sitemap
        uses: EndBug/add-and-commit@v9         # lightweight commit Action
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "chore: auto‑generate sitemap"
          add: "sitemap.xml"
